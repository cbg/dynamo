# Example control deployment for the openrouter suite: the native engine
# serving the same model with the same parser names, no Dynamo in the path.
# The external harness deploys its own `vllm-serve` / `sglang-serve` variants;
# this manifest is for reproducing a control run by hand on dev-02.
#
#   kubectl apply -f control-vllm-serve.example.yaml
#   python3 -m benchmarks.tool_calling.e2e_verifier --suite openrouter \
#     --base-url http://<control-service>:8000/v1 --model Qwen/Qwen3.6-35B-A3B \
#     --runtime vllm-serve --output-dir out/native
#   python3 -m benchmarks.tool_calling.e2e_verifier.compare \
#     --candidate out/dynamo/suite-result.json --control out/native/suite-result.json
apiVersion: v1
kind: Pod
metadata:
  name: control-vllm-native-qwen36
  labels: {app: control-vllm-native-qwen36}
spec:
  restartPolicy: Never
  nodeSelector: {nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3}
  containers:
  - name: vllm
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.1
    command: ["vllm", "serve", "Qwen/Qwen3.6-35B-A3B"]
    args:
    - --served-model-name=Qwen/Qwen3.6-35B-A3B
    - --dtype=bfloat16
    - --tensor-parallel-size=2
    - --gpu-memory-utilization=0.95
    - --max-model-len=32768
    - --max-num-seqs=128
    - --enforce-eager
    - --port=8000
    - --enable-auto-tool-choice
    - --tool-call-parser=qwen3_coder
    - --reasoning-parser=qwen3
    env:
    - {name: HF_HOME, value: /opt/models}
    - {name: HF_HUB_OFFLINE, value: "1"}
    ports: [{containerPort: 8000, name: http}]
    resources:
      requests: {cpu: "8", memory: 64Gi, nvidia.com/gpu: "2"}
      limits: {cpu: "16", memory: 128Gi, nvidia.com/gpu: "2"}
    volumeMounts:
    - {mountPath: /opt/models, name: model-cache}
    - {mountPath: /dev/shm, name: shm}
  volumes:
  - name: model-cache
    persistentVolumeClaim: {claimName: shared-model-cache}
  - name: shm
    emptyDir: {medium: Memory, sizeLimit: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: control-vllm-native-qwen36
spec:
  selector: {app: control-vllm-native-qwen36}
  ports: [{port: 8000, targetPort: 8000}]
